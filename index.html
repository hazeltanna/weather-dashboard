<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Weather Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="weather-sky" aria-hidden="true"></div>
  <canvas id="weather-canvas" aria-hidden="true"></canvas>
  <div id="weather-flash" aria-hidden="true"></div>
  <div id="grain" aria-hidden="true"></div>

  <div class="wrap">
    <header>
      <form id="search-form" class="search">
        <label for="city-input">Search city</label>
        <input type="text" id="city-input" placeholder="Search a city" autocomplete="off" />
        <button type="submit" class="btn btn-primary">Search</button>
      </form>

      <div class="seg" role="group" aria-label="Temperature unit">
        <button type="button" id="unit-c" aria-pressed="true">°C</button>
        <button type="button" id="unit-f" aria-pressed="false">°F</button>
      </div>

      <button type="button" id="geo-button" class="btn">📍 My Location</button>
    </header>

    <div id="recent-searches" aria-label="Recent searches"></div>

    <section id="status-section" aria-live="polite"></section>

    <section id="current-weather" class="hero" hidden>
      <!-- current weather injected here by JS -->
    </section>

    <section id="details-sheet" class="sheet" hidden>
      <div class="stats" id="stats-grid">
        <!-- feels like / humidity / wind / sunset injected here by JS -->
      </div>
      <div id="hourly-strip" class="hourly">
        <!-- next-8-hours injected here by JS -->
      </div>
      <div id="forecast-list" class="days">
        <!-- 5-day forecast injected here by JS -->
      </div>
    </section>
  </div>

  <template id="forecast-row-template">
    <div class="d">
      <span class="d-day"></span>
      <span class="d-icon"></span>
      <div class="rw">
        <span class="lo"></span>
        <div class="range"><i></i></div>
        <span class="hi"></span>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
